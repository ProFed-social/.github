name: Prepare README for GitHub Mirror

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/profile/**'

jobs:
  transform:
    runs-on: codeberg-small
    steps:
      - name: Clone Repository
        run: |
          git clone --depth=1 https://codeberg.org{{ github.repository }}.git .
          git checkout main

      - name: Transform and Prepare Structure
        run: |
          mkdir -p .github/profile
          sed 's|(\(img/\)|(../../\1|g' README.md > .github/profile/README.md

      - name: Commit changes back to Codeberg
        run: |
          git config user.name "ProFed CI Bot"
          git config user.email "bot@joinprofed.social"
          
          git add .github/profile/README.md
          
          if git diff-index --quiet HEAD --; then
            echo "Keine Änderungen am README festgestellt."
          else
            git commit -m "ci: update transformed README for GitHub mirror [skip ci]"
            git push https://x-access-token:${{ secrets.CODEBERG_WRITE_TOKEN }}@codeberg.org/${{ github.repository }}.git main
          fi

